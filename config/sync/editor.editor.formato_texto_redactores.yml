uuid: 3b5e535f-d3bb-441b-bb9f-a0a9f8b39954
langcode: en
status: true
dependencies:
  config:
    - filter.format.formato_texto_redactores
  module:
    - ckeditor5
format: formato_texto_redactores
editor: ckeditor5
settings:
  toolbar:
    items:
      - style
      - bold
      - italic
      - underline
      - '|'
      - link
      - '|'
      - heading
      - '|'
      - bulletedList
      - numberedList
      - alignment
      - '|'
      - blockQuote
      - drupalMedia
      - drupalInsertImage
      - insertTable
      - '|'
      - outdent
      - indent
      - undo
      - redo
      - code
      - sourceEditing
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_imageResize:
      allow_resize: true
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<span>'
    ckeditor5_style:
      styles:
        -
          label: 'Letra Capital'
          element: '<span class="letra-capital">'
        -
          label: 'Párrafo Resaltado'
          element: '<p class="caja-resaltada">'
        -
          label: 'Datos Importantes'
          element: '<ul class="lista-importante">'
        -
          label: 'Subtítulo Importante'
          element: '<h3 class="subtitulo-importante">'
    media_media:
      allow_view_mode_override: false
image_upload:
  status: false
