          alter:
            alter_text: true
            text: "{% set tiene_archivos = field_anexos|striptags|trim is not empty %}\r\n{% set tiene_enlace = field_enlace|striptags|trim is not empty %}\r\n\r\n{% if tiene_archivos %}\r\n  {# CASO 1: Tiene archivos -> Muestra el acordeón normal #}\r\n  <details class=\"acordeon-global-item\" name=\"grupo-acordeon\">\r\n    <summary class=\"acordeon-global-titulo\">\r\n      {% if tiene_enlace %}\r\n        <a href=\"{{ field_enlace|striptags|trim }}\" target=\"_blank\" class=\"titulo-link-externo\">{{ title }}</a>\r\n      {% else %}\r\n        {{ title }}\r\n      {% endif %}\r\n    </summary>\r\n    <div class=\"acordeon-global-contenido\">\r\n      {{ field_anexos }} \r\n    </div>\r\n  </details>\r\n{% else %}\r\n  {# CASO 2: NO tiene archivos pero SÍ tiene enlace -> Actúa como un enlace directo sin acordeón #}\r\n  {% if tiene_enlace %}\r\n    <div class=\"acordeon-global-item enlace-directo-item\">\r\n      <a href=\"{{ field_enlace|striptags|trim }}\" target=\"_blank\" class=\"acordeon-global-titulo titulo-link-externo sin-flecha\">\r\n        {{ title }}\r\n      </a>\r\n    </div>\r\n  {% else %}\r\n    {# CASO 3: No tiene nada, por seguridad imprime solo el título #}\r\n    <div class=\"acordeon-global-item enlace-directo-item\">\r\n      <div class=\"acordeon-global-titulo sin-flecha\">\r\n        {{ title }}\r\n      </div>\r\n    </div>\r\n  {% endif %}\r\n{% endif %}"
