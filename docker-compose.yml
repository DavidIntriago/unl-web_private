services:
  postgres:
    image: postgres:16
    container_name: drupal11_postgres
    restart: always
    environment:
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupalpass
      POSTGRES_DB: drupaldb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  drupal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drupal11_app
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - postgres
    volumes:
      - ./:/opt/drupal
      #Quitar y buildear la imagen en el docker file
      - ./php-custom.ini:/usr/local/etc/php/conf.d/php-custom.ini

volumes:
  postgres_data: