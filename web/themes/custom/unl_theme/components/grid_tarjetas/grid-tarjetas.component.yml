name: 'Grid Tarjetas'
description: 'Contenedor en cuadrícula para múltiples elementos.'
props:
  type: object
  properties:
    titulo:
      type: string
      title: 'Título de la Sección'
    variante:
      type: [string, 'null']
      title: 'Variante del Grid'
      enum:
        - 'default'
        - 'facultad'
        - 'contador'
        - 'sitios_interes'
        - 'imagenes'
        - 'sustantiva'
      default: 'default'
slots:
  items:
    title: 'Elementos del Grid'